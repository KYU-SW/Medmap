expected_claim: '''무잡음 폐쇄세계 응답 시뮬레이터(DDXPlus 합성, 49질환 단일질환 폐쇄 집합, 첫 증상 주어짐)에서, Q=5
  관계 그래프 탐색에 물은 음성 답을 반영하면 Top-5 재현율이 X%p(단측 CI) 변하고(실질 개선 판정은 점추정이 사전 기준 1.0%p 이상인지
  여부이며 1%p 이상 개선의 통계적 입증이 아님) 중증 정답 사례 누락률은 Y%p 변했다'' 수준. CI 는 생성기 내부 표본 변동만 반영하며
  실제 환자 일반화 불확실성은 포함하지 않는다. 시뮬레이터가 미기재=NEG 규약이라 H1 은 구조상 성립하기 쉬우며 새로움은 제한적이다. WD 결과는
  ''오답 WD 에 따른 질문 예산 재배분 영향'' 이다. 임상 진단 성능·실제 환자 안전성·임상 지침 기반 가지치기 안전성·임상의 앵커링 편향은
  주장하지 않는다. [rev6 한계 — 독립 코드 감사 2026-10-27] C·PA·PB_REL·PB·PC 는 실제 의료 관계 그래프 추론이 아니다.
  구현은 질환×근거 확률표(STEP16B ig_table)를 쓰는 나이브 베이즈 사후확률에 휴리스틱 질문 선택(상위 후보 연결 합·관계 유형 분할·사후비
  하향·WD 확인 질문)을 얹은 것이며, 그래프 순회·다중 경로·관계 유형 기반 질환 점수(사후확률)·근거 출처 묶음은 쓰지 않는다. 관계 유형(SUGGESTS/ARGUES_AGAINST)도
  같은 확률표에서 나온 값(P(POS|q,d) > 주변확률)으로 독립적인 의료 관계 지식이 아니며, 질문 선택(PB_REL·PB·PC)에만 쓰인다.
  따라서 결론은 ''확률표 기반 질문 선택 구성요소의 효과'' 로만 표현하고 ''그래프 추론의 효과'' 로 쓰지 않는다. 실제 다중 경로 그래프
  추론은 별도 탐색 연구 EXP-01b 후보로 분리한다.'
potential_confounders:
- C 는 음성 정보를 버린 비교 기준 + 시뮬레이터 음성 규약(미기재=NEG, 무잡음)이 실제 환자 답과 다름 → H1 효과크기는 상한
- DDXPlus 는 release_conditions 지식표로 생성됨 — TRAIN16 우도표·관계 그래프가 생성기 지식표를 거의 복원(기능적 순환).
  결과는 생성기 지식표 ≈ 학습 그래프 조건에서만 유효(일치율 보고)
- '스펙트럼: 49질환 폐쇄 집합, 단일 질환, 건강인·범위 밖 질환 없음, INITIAL_EVIDENCE 항상 주어짐, 생성기 유병률(실제 진료
  유병률과 다름). verification bias 는 해당 없음'
- TRAIN16 과 FINAL 의 동일 프로필 중복 — 결정 트리 암기 → FINAL_NOVEL 민감도
- Baseline A 는 무작위 노출 뷰로 학습됐고 AGE·SEX·범주형 질문을 쓴다; Baseline B 는 AGE·SEX 사용·부모 없는 이진
  질문만 — A·B 비교는 참조
- WD 는 시뮬레이션 — 실제 의사 WD 오류 분포와 다름. WD_MODEL 은 Baseline A 정보를 PC 에 들여옴(혼입)
- HOLDOUT 은 STEP16B 에서 1회 평가에 쓰였으나 Baseline A 구성 결정에는 사전등록상 쓰이지 않음(다른 worktree 는 합성
  fixture 테스트만, grep 확인). 쓰였다면 Baseline A 에 유리 → 그래프 쪽에 보수적
- 그래프 계열은 범주형 질문을 스스로 고르지 않음 — 질문 풀 차이
- PB 의 τ 규칙은 사전확률 낮은 질환에 불리할 수 있음 → 사전확률 사분위별 보고
- 주 지표 Q=5·상위 5 사전 고정, 나머지는 민감도
- 이진 자식 근거(부모가 있는 이진 질문)의 ig_table P(POS|q,d) 는 부모 양성 조건부가 아닌 결합확률 — 부모 양성 관측 뒤 naive
  Bayes 오지정. 모든 그래프 계열 공통이라 계열 내부 비교는 유효하나 절대 성능 해석 시 한계
- DDXPlus 생성 과정에서 같은 인구 표본(Synthea 개체)이 여러 행을 만들었을 가능성 — 환자 ID 가 없어 군집 처리 불가, 프로필
  중복은 FINAL_NOVEL 로 부분 대응. 한계로만 보고
- '그래프 계열의 질문 풀 = 부모 없는 이진 근거만(STEP16B Semantics 기준 — 존재하지 않는 부모를 가리키는 code_question
  은 무시: DDXPlus 이진 208개 모두 부모 없음, 하위 질문 14개(C 9·M 5) 전부 범주형. 원본 evidences.json 에는
  존재하지 않는 부모를 가리키는 이진 근거 5개 있음). Baseline A 는 범주형·하위 질문·AGE·SEX·판별 모델·IG 를 모두 쓰므로
  A 대비 차이는 입력·질문 풀·점수기·선택기가 동시에 다른 결과(원인 미분리)'
