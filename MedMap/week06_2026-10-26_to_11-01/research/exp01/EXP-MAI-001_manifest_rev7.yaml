experiment_id: EXP-MAI-001
title: EXP-01 관계 그래프 탐색의 구성요소 제거 실험(음성·관계유형·사후비 우선순위 하향·WD) — DDXPlus 합성, 증상 루트 결정
  트리는 기술 통계 참조
date: '2026-10-26T19:13:51'
research_question: '[rev7 2026-10-27, 독립 코드 감사·gate5 반영 — 한계 명시] 무잡음 폐쇄세계 응답 시뮬레이터(DDXPlus
  합성, 49질환 단일질환 폐쇄 집합) 아래에서, 같은 질문 예산과 같은 학습 정보(TRAIN16 우도표) 를 쓰는 질환·근거 관계 그래프 탐색에
  (1) 물은 음성 답 (2) 관계 유형 (3) 사후확률 비율 기반 확인 질문 우선순위 하향(재활성 가능, 질환 삭제 없음) (4) 시뮬레이션 WD
  확인 질문 우선 을 하나씩 추가하면 정답 질환 Top-5 재현율이 변하는가, 그리고 중증 정답 사례 누락률이 비열등한가?'
hypothesis: 'H1(주, 우월성): 무잡음 폐쇄세계 시뮬레이터 하에서 질문 예산 Q=5 일 때 PA(그래프 + 음성 우도)의 FINAL Top-5
  재현율이 C(같은 그래프, 양성 근거만)보다 높다. 귀무 H1_0: Δ(PA−C) ≤ 0 (Holm family 성분, 단측). 안전 성분(rev5
  A안: 합성 p 로 Holm family 안): 중증 정답 사례 누락률 귀무 Δ(PA−C) ≥ +0.5%p 를 함께 기각해야 한다. 실질 개선
  기준: Δ 점추정 ≥ MID_H1 = +0.01 (절대 재현율 차 +1.0 percentage point, 상대 1% 증가 아님). MID_H1
  은 합성 연구용 사용자 사전 고정값(2026-10-27, 실데이터 열람 전)이며 임상적 의미 근거가 없다. C 는 음성 정보를 버린 비교 기준이므로
  H1 효과크기는 실제 환자 응답 대비 상한이다.'
secondary_hypothesis: 'H2a(합성, Holm 성분): 비열등 Top-5@Q5 Δ(PB_REL−PA) 귀무 ≤ −0.5%p + 안전
  중증 누락 Δ(PB_REL−PA) 귀무 ≥ +0.5%p.

  H2b(합성): 안전 중증 누락 Δ(PB−PB_REL) 귀무 ≥ +0.5%p + 안전 잘못된 분기 종료 Δ(PB−PB_REL) 귀무 ≥ +0.5%p(두
  모델 같은 τ 식, PB_REL 가상 판정) + 효율 계산 수 비(PB/PB_REL) 사례별 기하평균 귀무 ≥ 0.90.

  H3a(합성): 중증 누락 Δ(PC−PB)@WD_MODEL_WRONG 귀무 ≥ +1%p + 잘못된 분기 종료 Δ(PC−PB)@WD_MODEL_WRONG
  귀무 ≥ +0.5%p.

  H3b(합성): H3a 와 같은 두 성분을 WD_RANDOM_WRONG 에서 seed 42·43·44 각각 — 6개 성분 p 의 최대.

  H3c(합성): 비열등 Top-5 Δ(PC−PB)@WD_MODEL 귀무 ≤ −0.5%p + 중증 누락 Δ(PC−PB)@WD_MODEL 귀무 ≥
  +0.5%p + 잘못된 분기 종료 Δ(PC−PB)@WD_MODEL 귀무 ≥ +0.5%p.

  H3 은 ''오답 WD 에 따른 질문 예산 재배분 영향'' 이며 임상의 앵커링 편향 검증이 아니다. WD 4조건 따로 보고, 합산 PC 단일 성능
  없음. H3b 효과는 seed 별 Δ 와 평균±std, 보조 하한은 seed 별로 보고.

  참조(기술 통계만, 인과 해석 금지): 사전 지정 모델(success_criterion 순차 채택 규칙으로 결정) vs Baseline A·B
  의 점추정 + 양측 95% CI. 사전 지정 모델이 PC 이면 참조 비교는 WD_MODEL 조건을 주 보고로 하고 WD_MODEL_WRONG·WD_RANDOM_WRONG(seed
  별)·WD_CORRECT(ORACLE) 를 병기한다. 점수기·선택기·입력(AGE·SEX)이 동시에 다르다.'
dataset: DDXPlus English release (합성 환자, CC-BY) — release_train_patients 파일만 사용
