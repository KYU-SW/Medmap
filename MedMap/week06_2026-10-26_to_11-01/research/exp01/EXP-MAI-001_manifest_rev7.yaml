data_modality: 합성 표형 문진 데이터(증상·과거력 질문-답). 영상·원문·검사 없음. 실제 환자 아님
label_definition: '정답 = PATHOLOGY(시뮬레이터 생성 단일 질환, 합성 라벨, 임상 Gold 아님). verification
  bias 해당 없음(모든 사례에 생성 라벨). 감별 재현율 평가에만 DIFFERENTIAL_DIAGNOSIS 사용. 중증 정답 사례 = PATHOLOGY
  가 release_conditions.json severity ≤ 2 인 17질환. severity 는 DDXPlus 데이터셋 저자 주석이며 임상
  must-not-miss 정의가 아니다. 척도 방향 1=가장 중증: 1차 출처 = Fansi Tchango et al., ''DDXPlus: A
  New Dataset For Automatic Medical Diagnosis'', NeurIPS 2022 Datasets and Benchmarks
  (arXiv 2205.09148) §3.1 "each disease is characterized by its level of severity
  ranging from 1 to 5 … the lowest values describing the most severe pathologies",
  부록 I.1 "severity … The lower the more severe." (2026-10-27 ar5iv 원문 확인). 파일 값 분포도
  일치(1 = Anaphylaxis, Larygospasm, Ebola, Possible NSTEMI / STEMI, Acute pulmonary
  edema; 5 = Panic attack, URTI, Chronic rhinosinusitis). 논문은 severity 를 평가 지표에 쓰지
  않으며, 이 실험의 ''중증 정답 사례'' 는 데이터셋 저자 주석에 기댄 정의다. 17질환(고정): severity 1 = Anaphylaxis,
  Larygospasm, Ebola, Possible NSTEMI / STEMI, Acute pulmonary edema; severity 2 =
  Spontaneous pneumothorax, Boerhaave, Epiglottitis, Guillain-Barré syndrome, Croup,
  PSVT, Scombroid food poisoning, Myocarditis, Acute dystonic reactions, Unstable
  angina, Stable angina, Pulmonary embolism. severity 사용 범위: 평가 메타와 SELECT 의 τ 선택
  기준만. 모델 입력·점수·질문 선택 금지. 응답 규약(STEP16B Semantics 그대로): 이진 = 기재 POS / 미기재 NEG(시뮬레이터
  규약, 실제 ''아니요'' 와 다름), 범주형 = VALUE 또는 부모 미양성 NA. 묻지 않은 근거 = NOT_RECORDED(어떤 모델도 우도·특징에
  쓰지 않음). 범주형 기본값 생략(UNSAFE)은 STEP16B 와 같이 INVALID(safe 질문에서는 STEP16B fit 단계에서 0건
  확인됨 — fit_ig_table 가 발생 시 예외).'
unit_of_analysis: 사례(case) = DDXPlus 합성 환자 1행. 환자 ID 없음. 지표·bootstrap 모두 사례 단위
n_patients: null
n_samples: null
split_strategy: '(1) TRAIN16/HOLDOUT = STEP16B 사전등록 규칙 그대로(s16b_core.split_key·is_holdout
  import, 복사·수정 금지): int(sha256(row_index|AGE|SEX|PATHOLOGY|EVIDENCES)[:8],16) % 10
  < 2 → HOLDOUT. 기대값 train 820,939 / holdout 204,663 / holdout_row_index_sha256 c277844b…eb38f77f(01_split_manifest.json)
  불일치 시 실험 중단(EXP01_STEP16B_SPLIT_MISMATCH). (2) HOLDOUT → SELECT/FINAL = int(sha256("EXP01|"+row_index)[:8],16)
  % 2 (0=SELECT, 1=FINAL). (3) SELECT_SMOKE = SELECT 중 sha256("EXP01SMOKE|"+row_index)
  오름차순 앞 1,000건. 프로필 = (AGE, SEX, INITIAL_EVIDENCE, EVIDENCES). 검증: exp/main_ai/exp01_symptom_graph/split_rules.py
  verify()(서로소·합집합· 기대값·프로필 중복률). SELECT/FINAL·중증 부분집합·FINAL_NOVEL 실제 수와 질환별 n 은 split
  실행 직후 run_meta 에 기록하고 FINAL 잠금 전에 rg record 로 남긴다(n_samples 확인 필요). n_patients 는
  합성이라 해당 없음.'
train_population: TRAIN16(820,939행). 우도표 = STEP16B ig_table_step16b_train.npz(TRAIN16,
  Laplace α=1) 그대로 로드(재추정 금지). Baseline A 모델 = STEP16B model_k3/k5/k10.pkl(TRAIN16
  학습, 재학습 금지). Baseline B 결정 트리만 TRAIN16 에서 새로 학습.
validation_population: 'SELECT — τ 선택과 구현 점검. 모든 SELECT 실행은 run_id 로 기록(실패 포함). SELECT_SMOKE
  1,000건은 파이프라인 점검 + EXPLORATORY 비교 전용. HOLDOUT 전체는 STEP16B 에서 사전등록에 따라 잠긴 채 1회 평가에만
  쓰였고(STEP16B prereg §2: ''모델 학습·IG 통계·규칙 결정에 일절 사용하지 않는다'', §6(prereg 42행): ''평가
  성능을 본 뒤 하이퍼파라미터 변경 금지''), Baseline A 구성 결정에 쓰이지 않았다. 다른 worktree(disease-knowledge,
  doctor-mode-foundation)에는 STEP16B 폴더 사본과 합성 fixture 테스트(tests/test_next_information_engine.py,
  s16b_core import)만 있고 STEP16B 폴더 사본(s16b_run.py 등) 외에 HOLDOUT 을 읽는 코드는 없음(2026-10-26·27
  grep 확인).'
test_population: 'FINAL — locked. FINAL 잠금 전제: (a) SELECT 전체에서 숨은 기록 누출 검사 위반 0, (b)
  근거 집합 일치 assert 위반 0과 그 변이 테스트 통과, (c) 금지 입력 정적 검사 통과, (d) Baseline A pkl 재현 대조
  통과, (e) 실행 잠금 해시 = sha256(config 파일 바이트 + exp/main_ai/**/*.py 정렬 경로별 SHA256 목록 +
  외부 read-only import 코드 SHA256 (~/medmap/medmap/{config,diagnosis,next_information,evidence,eligibility,patient_state}.py,
  ~/medmap/exp/step16b_next_information_validation/s16b_core.py) + ig_table·model_k*.pkl
  SHA + ~/medmap git HEAD) 를 rg record 로 기록(작업 폴더가 미커밋이라 git HEAD 만으로 코드 특정 불가; 외부
  경로는 `git status --porcelain` 이 비어 있어야 잠금 가능), (f) FINAL 의 17 중증 질환별 n 과 n≥100 질환
  수를 rg record(라벨 개수만, 지표 아님). FinalGuard 는 잠금 파일의 실행 잠금 해시와 실행 시 해시가 같을 때만 1회 허용(2회째
  거부). 실행이 지표 산출 전에 환경 이유로 죽으면 같은 config 로 1회 재시도 허용하고 사유 기록(FINAL 출력 폴더에 run_meta·진행
  로그 외 파일(per_case.parquet·metrics·comparisons 등)이 하나라도 있으면 재시도 불가; FINAL 진행 로그에는
  지표 값을 출력하지 않는다; metrics_written 은 출력 폴더를 실제로 검사해 결정). FINAL 에서 위반이 나오면 INVALID —
  이후 재실행은 EXPLORATORY 이며 확인적 판정 불가. 민감도: FINAL_NOVEL(TRAIN16 에 같은 프로필이 없는 행). 공식 DDXPlus
  release_validate_patients(STEP14·15·16A 반복 사용)· release_test_patients(STEP13B 에서
  1회 개봉·평가된 이력, 사용자 규칙 2026-09-21 이후 미개봉)는 사용하지 않는다(guarded_path 예외).'
preprocessing_fit_scope: '모든 학습·추정(우도표, 결정 트리, 관계 유형)은 TRAIN16 에서만. SELECT/FINAL 통계로
  적합하지 않는다. 관계 유형(이진 근거만): SUGGESTS(q,d) ⇔ P(POS|q,d) > P(POS|q) (TRAIN16 질환 빈도 가중
  주변확률), 그 외 ARGUES_AGAINST. 범주형 근거에는 관계 유형을 두지 않는다. 관계 유형별 간선 수를 보고. 강제 수단: searchers/·likelihood.py
  는 release_conditions.json·severity 를 읽지 않는다(정적 검사 테스트: 해당 모듈 소스에 ''release_conditions''·''severity''
  문자열 0, import 그래프에 평가 모듈 없음). severity 17질환 목록은 metrics.py 만 SHA 대조 후 로드.'
baseline: '공통 통제(모든 모델): 시작 관측 = INITIAL_EVIDENCE(POS), 질문 예산 Q∈{3,5,10}(주 Q=5), 답변은
  시뮬레이터 observe() 로만 수신(STEP16B Semantics: E_134·E_152 제외, 부모 POS 일 때만 자식 질문 가능 —
  이 부모-자식 규칙은 모든 모델 공통이며 가지치기가 아님), 후보 표시 수 m∈{5,8}(STEP16B 뷰 k 와 구분해 m 으로 표기), 학습
  정보 = TRAIN16 만. 탐색기 인터페이스: reset(initial_evidence, age, sex, wd=None) / next_question()
  / observe(q, answer) / ranking() — case 레코드를 받지 않는다. 금지 키(PATHOLOGY, EVIDENCES,
  DIFFERENTIAL_DIAGNOSIS, severity) 전달 시 assert, PATHOLOGY 주입 변이 테스트 필수. 입력 정보: 그래프
  계열(C, PA, PB_REL, PB, PC)은 AGE·SEX 를 쓰지 않는다. Baseline A·B 는 쓴다(참조 비교의 차이로 명시). Baseline
  A = STEP16B MODEL_k(Q=3→k3, 5→k5, 10→k10) + INTERNAL_IG, ~/medmap 의 medmap.diagnosis·medmap.next_information
  을 읽기 전용 import. 재현 대조: SELECT_SMOKE 에서 초기 예측이 STEP16B 02_holdout_initial_predictions.csv
  와 같은 뷰 조건으로 일치 (불일치 시 중단). 대조 시 02_holdout_initial_predictions.csv 는 SELECT_SMOKE
  행만 필터해 읽는다(FINAL 행의 정답 열 미열람). 이 대조는 STEP16B 연구 경로만 검증하므로, 실제 평가 경로(BaselineASearcher
  → medmap 엔진)는 모든 분할에서 매 단계 독립 재계산(aref)으로 대조한다(독립 감사 M1). Baseline B = 전역 결정 트리
  1개(sklearn DecisionTreeClassifier, criterion=entropy, min_samples_leaf=50, max_depth=10,
  random_state=seed). 특징 = 부모 없는 이진 근거(E_134·E_152 제외; 학습 인코딩 = EVIDENCES 에 기재 1,
  미기재 0 — 시뮬레이터 NEG 규약과 같음) + AGE 10구간 + SEX. INITIAL_EVIDENCE 는 해당 이진 특징을 1로 미리 관측(질문
  예산 소비 없음). 추론: 루트부터 내려가며 근거 특징 노드는 그 근거를 질문(예산 1 소비, 이미 관측이면 소비 없음), AGE·SEX 노드는
  무료. 예산 소진 또는 잎 도달 시 현재 노드의 클래스 빈도로 순위(트리 깊이·경로 길이는 확률로 쓰지 않음). Baseline C = 그래프
  탐색. 점수 log post(d) = log prior(d)(TRAIN16 빈도) + Σ_{관측 양성형 답 a} log P(a|q,d) (양성형
  = 이진 POS, 범주형 VALUE; 다중값은 값마다 합산; ig_table 의 P(a|q,d) 그대로). 질문 = 상위 8 후보 D8 에 대해
  Σ_{d∈D8} P(POS|q,d) 최대인 미질문·eligible **이진** 질문(동점 = 근거 번호 오름차순). 그래프 계열은 범주형 질문을
  스스로 고르지 않는다(모든 그래프 모델 공통, A·B 와의 차이로 명시).

  순위 동점 규칙(모든 모델 공통): 점수(또는 잎 빈도)가 같은 질환들은 비관적으로 처리 — 정답 질환을 동점 집단의 맨 뒤에 둔다(Top-k
  판정이 동점 처리 우연으로 유리해지지 않게). 확률·ECE 계산에는 동점 처리 영향 없음.'
proposed_method: 'PA = C + 물은 이진 질문의 NEG 답 우도 log P(NEG|q,d) 추가. 질문 규칙은 C 와 동일(변수
  1개). PB_REL = PA + 관계 유형 기반 질문 점수: score(q) = min(#{d∈D8: SUGGESTS(q,d)}, #{d∈D8:
  ARGUES_AGAINST(q,d)}) 최대 (상위 후보를 둘로 가르는 질문 우선), 동점 = C 의 질문 점수, 그다음 근거 번호. 가중치·하이퍼파라미터
  없음. 점수기는 PA 와 동일. PB = PB_REL + 사후확률 비율 기반 확인 질문 우선순위 하향(재활성 가능): 매 단계 활성 집합 Act
  = {d: post(d)/max post ≥ τ}; 질문 점수(관계 점수와 동점 처리용 C 점수 모두) 계산의 후보 집합을 D8 ∩ Act 로
  줄인다(질환 d 의 ''확인 질문 하위 작업'' = d 에 SUGGESTS 인 이진 질문). 순위는 사후확률 그대로이며 질환을 삭제하지 않는다.
  다음 단계에서 비율이 τ 이상이 되면 자동 재활성(재활성 로그). τ∈{1e-2,1e-3,1e-4}. 가지치기 발동률(D8∩Act ≠ D8 인
  단계 비율)을 보고 — 0 에 가까우면 PB ≡ PB_REL 로 기록. 이 규칙은 의료 지침 기반 필수 조건 가지치기가 아니며 임상 안전성을 주장하지
  않는다(common/evidence_graph.py 의 명시적 NEGATIVE 조건 규칙과 다름 — 그 규칙은 DDXPlus 에 임상 필수 조건이
  없어 이번 실험에서 쓰지 않고 가상 시나리오 단위 테스트로만 유지). 결정 트리 분기(경로 밖 질환이 복원 불가하게 사라짐)와 다르다. PC =
  PB + WD 확인 질문 우선: 질문 예산 중 처음 min(2, Q−1) 개를 WD 확인 질문(미질문·eligible 이진 질문 중 SUGGESTS(q,WD)
  이고 P(POS|q,WD) 내림차순, 동점 근거 번호)에 쓰고 나머지는 PB 규칙. 순위는 사후확률 그대로(WD 를 앞에 두지 않음). WD 는
  시뮬레이션(DDXPlus 에 실제 의사 진단 없음): WD_CORRECT = ORACLE(정답 주입, 상한 참고, 성능 주장 금지), WD_MODEL
  = Baseline A MODEL_k3 의 초기 상태(INITIAL_EVIDENCE+AGE+SEX) top-1, WD_MODEL_WRONG =
  같은 순위에서 정답이 아닌 최상위 (PATHOLOGY 조건부 스트레스 조건), WD_RANDOM_WRONG = 정답 외 48질환 균등(사례별 sha256(seed|row_index)
  로 결정, PATHOLOGY 조건부 스트레스 조건). WD 생성에 DIFFERENTIAL_DIAGNOSIS 사용 금지. WD_MODEL 은 Baseline
  A 의 정보(AGE·SEX 포함)를 PC 에 들여오므로 PB→PC 에서 ''WD 우선'' 과 ''다른 모델 정보'' 가 함께 바뀐다(혼입 요인으로
  명시). WD_MODEL 과 PB 초기 top-1 일치율 보고.'
ablations:
- 'C → PA: 음성 우도 추가(H1)'
- 'PA → PB_REL: 관계 유형 질문 점수(H2a)'
- 'PB_REL → PB: 사후확률 비율 기반 확인 질문 우선순위 하향(H2b)'
- 'PB → PC: WD 확인 질문 우선, WD 4조건 각각(H3a·H3b·H3c, WD_CORRECT 는 오라클 참고)'
- 모든 그래프 모델은 같은 TRAIN16 우도표·같은 관측 정보·같은 이진 질문 풀만 사용. 단계마다 변수 1개만 추가
- '민감도(기술 통계, 판정 불변): FINAL_NOVEL; Q=3·10; 재현율@8 (Top-5 대신); seed 43·44(결정 트리, 무작위
  WD); margin 0.25·0.5·1%p 판정표'
- '응답 잡음 민감도(기술 통계, 판정 제외): 물은 이진 질문 답을 p∈{0.05,0.10} 로 뒤집기(POS↔NEG), 별도로 p∈{0.05,0.10}
  를 UNCERTAIN(모름)으로 바꾸고 우도 미반영. 사례별 sha256 고정'
- 'WD 정답률 혼합 민감도(기술 통계): 사례별로 WD_CORRECT/WD_MODEL_WRONG 를 p_correct∈{0.5,0.7,0.9}
  로 혼합. 실제 의사 정확도는 모름'
- '가상 규칙 시나리오(단위 테스트, 임상 주장 아님): common/evidence_graph.py 명시적 NEGATIVE 조건 규칙의 잘못된
  비활성화 0'
primary_metric: Top-5 재현율 @ Q=5 = FINAL 사례 중 질문 종료 시 사후 순위 상위 5 안에 PATHOLOGY 가 있는
  비율(사례 단위 평균).
secondary_metrics:
- 중증 정답 사례 누락률(DDXPlus severity≤2, 데이터셋 주석) = PATHOLOGY∈17질환 사례 중 종료 시 상위 8 밖 비율.
  bootstrap 매 반복에서 FINAL 전체를 재표본한 뒤 부분집합 비율 재계산. 17질환 질환별 누락률·n 필수 보고(n<100 질환은 결론
  보류)
- 사전확률(TRAIN16 빈도) 사분위별 Top-5·누락률·잘못된 분기 종료율
- Top-1/3, 재현율@8, Q=3·10 의 Top-5, 감별 재현율(DIFFERENTIAL 질량 중 상위 8 비율, 평가 전용), 정답 아닌
  사례에서 DIFFERENTIAL 의 severity≤2 질환이 상위 8 에 있는 비율(평가 전용)
- '잘못된 분기 종료율 = 종료 시 정답 질환이 Act 밖(post/max post < 선택된 τ)인 사례 비율 — PB 와 PB_REL 에 같은
  식으로 계산(PB_REL 은 가상 판정). Baseline B: 멈춘 노드의 정답 클래스 빈도 0 인 비율'
- 숨은 기록 누출 검사(이름 변경) = 묻지 않은 자식 없는 이진 근거 1개(사례별 해시 고정)의 숨은 값을 뒤집은 복제 사례와 원 사례의 질문
  경로·최종 순위가 다른 비율. 기준 0. A·B 포함 전 모델
- '근거 집합 일치 assert(미기록→음성 오류 검출) = 매 단계 우도·특징 계산에 들어간 (질문, 답) 집합 == observe() 로 받은
  집합. 위반 0. 변이 테스트: 미기록 근거를 NEG 로 더하는 변이를 넣으면 assert 가 실패해야 함. A·B 포함 전 모델. 추가로 관측
  집합만으로 사후확률을 다시 계산하는 독립 참조 점수기와 매 단계 수치 대조(허용 오차 1e-9)'
- 음성 반영 방향 정합률 = 물은 이진 질문 NEG 답 직후, P(POS|q,d) ≥ 0.9 인 질환들의 평균 사후 순위가 내려간 비율
- 질문 선택 효율 = 정답이 처음 상위 5 에 들어온 질문 번호(미진입 Q+1), 평균 실제 질문 수
- '질문 선택 계산 수(닫힌 식, 구현 방식 무관) = Σ_단계 [ |D_cand| × |Q_elig| × s + 49 × a ]. D_cand
  = 질문 점수 계산 후보 질환 집합(C·PA·PB_REL = D8, PB·PC = D8∩Act), Q_elig = 그 단계의 미질문·eligible
  이진 질문 수, s = 그 모델이 매 단계 모든 (질환, 질문) 쌍에 대해 항상 계산하는 점수 종류 수(C·PA = 1, PB_REL·PB·PC
  = 2: 관계 점수 + 동점 처리용 C 점수, 동점 여부와 무관하게 계산한 것으로 센다), a = 그 단계에서 받은 답 수(사후 갱신). 사례별
  PB/PB_REL 비(분모 0 사례 수 보고 후 제외)의 기하평균과 단측 97.5% 상한. A·B 는 기술 통계만'
- 추론 시간 = 사례당 ms p50·p95, 단일 프로세스·같은 머신, 첫 100 사례 워밍업 제외(기술 통계)
- 메모리 = 모델별 피크 RSS MB(기술 통계, 90% 상한 감시)
- 보정 = top-1 확률 ECE(15 bin)·다중 클래스 Brier(확률 모델 전부, 기술 통계, 제품 표시 금지 계약 유지)
- 가지치기 발동률·재활성 횟수, 관계 유형별 간선 수, WD_MODEL vs PB 초기 top-1 일치율
- '인구집단 부분집합(기술 통계): AGE 구간(0–14, 15–64, 65+)·SEX 별 Top-5 와 중증 누락률, 질환 균형(macro) Top-5'
metric_unit: 비율(0–1, 보고는 %p), 시간 ms, 메모리 MB, 계산 수 회. 모든 비율·CI 는 사례 단위
threshold_selection: '분류 임계값 없음. PB 의 τ 만 SELECT(Q=5)에서 사전 규칙으로 선택: τ∈{1e-2,1e-3,1e-4}
  중 SELECT 에서 (중증 누락률@상위8 ≤ PB_REL 값) AND (잘못된 분기 종료율 ≤ 같은 τ 값으로 계산한 PB_REL 가상 판정값)
  인 τ 들 가운데 Top-5@Q5 최고, 차 < 0.1%p 동률이면 더 작은 τ. 만족하는 τ 가 없으면(TAU_FAIL): PB = ''가지치기
  없음'', p_H2b := 1 로 Holm 에 투입(family m=6 유지), H3 의 기준 모델은 PB_REL, PC = PB_REL + WD
  확인 질문 우선(가지치기 없음). τ 가 없으므로 H2b·H3a·H3b·H3c 의 잘못된 분기 종료 성분은 NA 로 보고하고 합성 p 의 최대에서
  제외한다. PB 단계 라벨 = TAU_FAIL(채택 안 함), PC 단계 = NOT_ELIGIBLE(순차 규칙상 채택 불가).'
model_selection: 'SELECT(SMOKE 1,000행 포함 전체)에서만 τ 선택과 구현 점검. SELECT_SMOKE 단독 결과는 선택에
  쓰지 않는다. 나머지 설정은 이 manifest 값으로 사전 고정. SELECT 의 모든 실행은 run_id·실행 잠금 해시로 기록(실패 포함).
  SELECT 실행 사이의 코드 변경은 INVALID 가 아니어도 diff·사유·변경 전후 SELECT 지표를 run 로그에 남긴다(성능 조정의
  버그 수정 위장 방지). 마지막 SELECT 실행의 잠금 해시를 rg record 로 잠근 뒤 FINAL 1회. 확인적 비교 대상(H2b 의 PB_REL,
  H3 의 PB 또는 τ 실패 시 PB_REL)은 SELECT 종료 시점에 고정하며 FINAL 결과로 다시 지정하지 않는다. FINAL 을 본 뒤
  바꾼 것은 EXPLORATORY 로 별도 표기, 공식 판정 변경 금지. FINAL 잠금 전 rg record: SELECT 의 C·PA 기준 수준
  대비 margin 상대 크기, SELECT 불일치 비율로 추정한 각 비교의 기대 SE·최소 검출 차, SELECT 질환별 n 으로 본 질환별 규칙의
  귀무 하 발동 가능성, 그리고 A안 합성 p 의 성분별 검정력(exp00_readiness/scripts/power_holm_composite.py
  식에 SELECT 의 실제 불일치율 d·부분집합 n 을 넣은 값). 검정력이 낮아도 margin·MID·α 는 바꾸지 않고 한계로 보고한다.'
statistical_test: 'FINAL 사례 단위 대응 bootstrap(B=10,000, seed 20261026 — WD·트리 seed 와
  독립, 모든 모델·WD 조건·seed 에 같은 재표본 인덱스, 500회 단위 분할 또는 multinomial 가중치, FINAL 전체 재표본,
  부분집합 비율은 매 반복 분모 재계산).

  성분 단측 p: 좋아져야 하는 지표 p=(#{Δ*≤b}+1)/(B+1), 나빠지면 안 되는 지표 p=(#{Δ*≥b}+1)/(B+1), 계산 수
  비 p=(#{GM*≥0.90}+1)/(B+1).

  [rev5 A안 — gate 2 통계 reviewer 권장안, 2026-10-27 사용자 지시] 확인적 가설 6개의 판정 p 는 성분 p 의 최대(합성
  p, 교집합-합집합 원리):

  p_H1 = max(p[Top-5 Δ(PA−C), b=0], p[중증 누락 Δ(PA−C), b=+0.5%p]);

  p_H2a = max(p[Top-5 Δ(PB_REL−PA), b=−0.5%p], p[중증 누락 Δ(PB_REL−PA), b=+0.5%p]);

  p_H2b = max(p[중증 누락 Δ(PB−PB_REL), b=+0.5%p], p[잘못된 분기 종료 Δ(PB−PB_REL), b=+0.5%p],
  p[계산 수 비 GM, b=0.90]) (TAU_FAIL 이면 1);

  p_H3a = max(p[중증 누락 Δ(PC−PB)@WD_MODEL_WRONG, b=+1%p], p[잘못된 분기 종료 Δ(PC−PB)@WD_MODEL_WRONG,
  b=+0.5%p]);

  p_H3b = max over seed∈{42,43,44} of max(p[중증 누락 Δ(PC−PB)@WD_RANDOM_WRONG, b=+1%p],
  p[잘못된 분기 종료 Δ(PC−PB)@WD_RANDOM_WRONG, b=+0.5%p]);

  p_H3c = max(p[Top-5 Δ(PC−PB)@WD_MODEL, b=−0.5%p], p[중증 누락 Δ(PC−PB)@WD_MODEL, b=+0.5%p],
  p[잘못된 분기 종료 Δ(PC−PB)@WD_MODEL, b=+0.5%p]).

  TAU_FAIL 이면 잘못된 분기 종료 성분은 NA 로 최대에서 제외. 6개 합성 p 에 Holm(단조 누적 조정, family 단측 α=0.025).
  판정은 Holm 조정 합성 p < 0.025.

  기존 경계 b, Holm m=6, 단측 α 0.025 는 rev4 와 같다(성분을 family 안으로 옮긴 것만 바뀜). 모든 성분 p 를 comparisons.csv
  에 따로 기록한다.

  H1 실질 개선: Δ 점추정 ≥ 0.01 을 정수로 판정 ((k_PA − k_C)·100 ≥ N_FINAL). 같은 bootstrap 의 P*(Δ*≥0.01)
  과 단측 하한 ≥ 0.01 여부를 기술 통계로 보고. margin(0.5%p, 1%p)·MID 는 합성 연구용 임의 사전 고정값이며 임상 근거
  없음.'
paired: true
bootstrap_unit: case
n_bootstrap: 10000
confidence_interval: '판정은 Holm 조정 합성 p 로만 한다. 보조 보고: 각 성분의 단측 한계를 그 합성 가설의 Holm 순위
  수준 (1−0.025/(m−i+1)) 으로(H3b 는 seed 별), 어긋나면 p 기준. 그 외 지표·효과 크기: 양측 95% percentile
  CI, 기술 통계. CI 는 고정된 TRAIN16 적합 조건의 생성기 내부 표본 변동만 반영.'
multiple_comparisons: '[rev5 A안] Holm, family 단측 α=0.025, m=6 고정. 안전 성분(중증 누락·잘못된
  분기 종료)과 효율 성분(계산 수 비)은 합성 p(최대 p)로 family 안에 들어가므로 확인적 성공·채택 주장 전체(효능·비열등·안전·효율)의
  FWER ≤ 0.025 다(최대 p 는 유효한 p 값, Holm 은 임의 의존 구조에서 FWER 보존). rev4 B안의 합집합 상한 0.225
  문구는 폐기. 안전 오류 = 참 Δ 가 margin 이상인데 비열등으로 판정하는 경우. 질환별 악화 규칙은 채택을 막기만 하는 보수 규칙이라 오류율
  계산에 넣지 않는다. 이차 지표·Baseline A/B 비교·민감도 분석(FINAL_NOVEL, Q=3·10, 재현율@8, seed, WD_CORRECT·혼합,
  응답 잡음, margin 표, 인구집단 부분집합)은 보정 없는 기술 통계이며 주 판정을 바꾸지 못하고 방향 일치 여부만 기술. 검정력 영향: 성분이
  모두 같은 margin 근처에서 동시에 검정되므로 합성 가설 검정력 ≤ 성분 검정력의 최솟값. 근사표 exp00_readiness/outputs/power_holm_composite.md
  (예: margin 0.5%p, 참 Δ 0, 불일치율 0.03 이면 성분 n=20,000 에서 Holm 최악 수준 검정력 0.926, n=5,000
  에서 0.275). FINAL 잠금 전 실제 값으로 rg record.'
success_criterion: "[rev5] 모든 판정은 FINAL 1회 결과로만 한다. SELECT_SMOKE(1,000)는 예비 평가, SELECT\
  \ 전체는 τ 선택용 평가이며 통계적 성공·실질 개선·안전 판정에 쓰지 않는다.\n각 합성 가설 j 의 Holm 순위 수준 α_j* = 0.025/(m\
  \ − rank_j + 1)(rank = 합성 p 오름차순 순위)을 라벨 판정에 쓴다.\nH1 판정은 아래 순서로 첫 해당 라벨을 붙인다(모든\
  \ 경우를 덮는다):\n  1) INVALID — failure_criterion 의 유효성 위반.\n  2) SAFETY_FAIL — H1 안전\
  \ 성분(중증 누락 Δ(PA−C), b=+0.5%p) p > α_H1*. 뜻: 안전 비열등 미입증(악화를 입증한 것은 아님). SUCCESS 아님,\
  \ PA 채택 안 함.\n  3) SAFETY_HOLD — 질환별 악화 규칙 발동(FINAL n≥100 인 중증 질환 중 하나라도 누락률 점추정\
  \ 악화 > +2%p, 정수 비교 (k_new−k_old)·50 > n_d). SUCCESS 아님, 재평가 대기가 아닌 확정 미채택. 점추정 기준의\
  \ 의도된 보수 규칙이며 질환별 n·SE 를 함께 보고.\n  4) 유의성 × 실질 개선 4칸(유의 = Holm 조정 p_H1 < 0.025):\
  \ 유의 & Δ̂ ≥ 0.01 = SUCCESS / 유의 & Δ̂ < 0.01 = SIGNIFICANT_BELOW_MID('통계적으로 검출되나\
  \ 실질 이득 미달', SUCCESS 아님) / 비유의 & Δ̂ ≥ 0.01 = ABOVE_MID_NOT_SIGNIFICANT('점추정은 기준\
  \ 이상이나 통계적 근거 부족', SUCCESS 아님) / 비유의 & Δ̂ < 0.01 = FAILURE.\n효과 크기 정의: Δ_H1 = Top-5@Q5(PA)\
  \ − Top-5@Q5(C)(절대 재현율 차). 보고: Δ̂, Holm 순위 맞춤 단측 하한(보조), 양측 95% CI, P*(Δ*≥0.01).\
  \ '실질 개선' 은 '점추정이 사전 기준 1.0%p 이상' 이라는 뜻으로만 쓰고 '1%p 이상 개선이 통계적으로 입증' 이라고 쓰지 않는다.\n\
  안전성은 재현율·효율과 독립 판정하며 상쇄하지 않는다.\n비H1 단계 라벨(위에서부터 첫 해당): INVALID > NOT_ELIGIBLE(순차\
  \ 사슬의 앞 단계 미채택 — 채택 판단만, 계산·보고는 함) > TAU_FAIL(PB·PC 해당) > SAFETY_FAIL(그 합성 가설의 안전\
  \ 성분 하나라도 p > α_j*) > SAFETY_HOLD(그 단계 질환별 규칙 발동) > NI_NOT_SHOWN(비열등 성분 p > α_j*)\
  \ > EFFICIENCY_NOT_SHOWN(계산 수 비 성분 p > α_j*) > HOLM_NOT_REJECTED(성분은 모두 α_j* 이하지만\
  \ Holm 단계 하강이 앞에서 멈춤) > ADOPTED.\n단계별 채택(ADOPTED): PB_REL = H2a Holm 기각 + 질환별 규칙\
  \ 통과. PB = τ 선택 성공 + H2b Holm 기각 + 질환별 규칙 통과. PC = H3a·H3b·H3c Holm 기각 + 질환별 규칙\
  \ 통과(규칙 적용 조건 = WD_MODEL·WD_MODEL_WRONG·WD_RANDOM_WRONG seed 3개 모두, WD_CORRECT 제외).\n\
  순차 채택: C → PA → PB_REL → PB → PC 순서로, 첫 '채택 안 함' 단계에서 멈추고 직전 채택 모델을 사전 지정 모델로 한다(아무것도\
  \ 채택 안 되면 C). PA 채택 = H1 라벨 SUCCESS. Holm 6개 합성 p·모든 성분 p·질환별 규칙은 사슬과 무관하게 전부 계산·보고한다(비교\
  \ 대상은 SELECT 종료 시점 고정값).\n모든 결론은 '무잡음 폐쇄세계 DDXPlus 시뮬레이션 성능' 으로만 표현."
failure_criterion: 'H1 FAILURE 계열 라벨(success_criterion 순서표): SAFETY_FAIL(안전 비열등 미입증),
  SAFETY_HOLD(확정 미채택), SIGNIFICANT_BELOW_MID, ABOVE_MID_NOT_SIGNIFICANT, FAILURE —
  모두 SUCCESS 아님. 안전 라벨은 재현율 결과와 무관하게 우선한다.

  INVALID(즉시 중단, 확인적 판정 불가) = split 기대값 불일치, 입력 SHA 불일치, 공식 validate/test 접근, release_conditions·severity
  의 탐색기 접근(정적 검사·런타임 guard), 금지 키 전달, 숨은 기록 누출 > 0, 근거 집합 assert 위반, 독립 참조 점수기와 사후확률
  불일치, UNSAFE 발생, FINAL 2회 사용, 실행 잠금 해시 불일치, Baseline A 평가 경로 독립 재계산 불일치(aref: 사후확률
  1e-9·다음 질문·답 변환, 매 단계 — 독립 감사 M1). SELECT 에서의 INVALID 는 수정 + rg deviation + 재gate
  후 재실행 가능. FINAL 에서의 INVALID 이후 재실행은 EXPLORATORY.

  사전 지정 모델 vs Baseline A 가 낮으면 ''그래프 계열이 A 보다 낮음(점수기·선택기·입력 동시 차이, 원인 미분리)'' 으로 기술,
  부정 결과 보존.'
exclusion_criteria: 사례 제외 없음. UNSAFE 는 INVALID(STEP16B 규약, safe 질문 0건 예상). 숨은 기록 누출
  검사의 뒤집기 대상은 자식 없는 이진 근거로 제한(NA·UNSAFE 생성 방지), 대상이 없는 사례는 검사에서만 제외하고 수 보고.
